<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Holi</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(45deg, #ff4081, #ffeb3b, #00e676, #00bcd4);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
            font-family: 'Poppins', sans-serif;
            text-align: center;
            color: white;
            overflow: hidden;
            position: relative;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
            z-index: 2;
        }

        h1 {
            font-size: 5em;
            text-shadow: 3px 3px 15px rgba(0,0,0,0.5);
            animation: bounce 2s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .btn {
            padding: 20px 40px;
            font-size: 1.5em;
            font-weight: bold;
            background: white;
            color: #ff4081;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .btn:hover {
            background: #ffeb3b;
            color: black;
        }

        .color-splash {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(255,255,255,0.3) 20%, rgba(0,0,0,0.1) 80%);
            border-radius: 50%;
            position: absolute;
            opacity: 0;
            animation: splash 1.5s linear infinite;
        }

        @keyframes splash {
            0% {
                transform: scale(0);
                opacity: 1;
            }
            100% {
                transform: scale(3);
                opacity: 0;
            }
        }

        .confetti {
            position: absolute;
            width: 12px;
            height: 12px;
            background: red;
            opacity: 0.8;
            animation: fall linear infinite;
            transform-origin: center;
        }

        @keyframes fall {
            from {
                transform: translateY(-10vh) rotate(0deg);
            }
            to {
                transform: translateY(100vh) rotate(720deg);
            }
        }

        .footer {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            font-size: 1.2em;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Happy Holi!</h1>
        <button class="btn" onclick="playHoli()">Celebrate Now!</button>
    </div>

    <div class="footer">Enjoy the festival of colors! 🎨</div>

    <script>
        function playHoli() {
            for (let i = 0; i < 30; i++) {
                let splash = document.createElement("div");
                splash.className = "color-splash";
                splash.style.top = Math.random() * window.innerHeight + "px";
                splash.style.left = Math.random() * window.innerWidth + "px";
                splash.style.background = `rgb(${Math.random() * 255}, ${Math.random() * 255}, ${Math.random() * 255})`;
                document.body.appendChild(splash);
                setTimeout(() => splash.remove(), 2000);
            }
            generateConfetti();
        }

        function generateConfetti() {
            for (let i = 0; i < 70; i++) {
                let confetti = document.createElement("div");
                confetti.className = "confetti";
                confetti.style.left = Math.random() * window.innerWidth + "px";
                confetti.style.background = `rgb(${Math.random() * 255}, ${Math.random() * 255}, ${Math.random() * 255})`;
                confetti.style.animationDuration = (Math.random() * 3 + 2) + "s";
                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), 5000);
            }
        }
    </script>
</body>
</html>
